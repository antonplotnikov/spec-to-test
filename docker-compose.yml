# Spec-to-Test with the Automation tab. Put settings in a .env file next to
# this file (compose reads it for ${...}); see README "Automation".
services:
  app:
    build: .
    image: spec-to-test:local
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}  # empty = the provider's default model
      AI_LOCK_SETTINGS: ${AI_LOCK_SETTINGS:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # LM Studio / vLLM / llama.cpp on the host: http://host.docker.internal:1234/v1
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      # Ollama on the host machine: OLLAMA_HOST=http://host.docker.internal:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-}  # seconds per AI request; empty = 300
      AUTOMATION_ALLOWED_HOSTS: ${AUTOMATION_ALLOWED_HOSTS:-}
      AUTOMATION_ALLOW_PRIVATE_NETWORK: ${AUTOMATION_ALLOW_PRIVATE_NETWORK:-false}
      AUTOMATION_IGNORE_HTTPS_ERRORS: ${AUTOMATION_IGNORE_HTTPS_ERRORS:-false}
      # Credentials the tests may type, by name. Add one line per secret:
      # AUTOMATION_SECRET_STAGING_PASSWORD: ${AUTOMATION_SECRET_STAGING_PASSWORD:-}
    # Isolation for the browser and the test runner.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/pwuser:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    shm_size: 1gb  # Chromium needs more shared memory than Docker's 64 MB default
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
