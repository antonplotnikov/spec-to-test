name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # AI stays off and nothing is written outside the temp folder (see tests/conftest.py).
        run: pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
      - name: AI quality evaluation (scripted model, offline)
        # Exits 1 when a regression threshold in evaluation/thresholds.json is missed.
        working-directory: src
        env:
          AI_PROVIDER: none
        run: python -m spec_to_test.evaluation --json ../evaluation.json --markdown ../evaluation.md
      - name: Rule engine evaluation (no AI)
        if: always()
        working-directory: src
        env:
          AI_PROVIDER: none
        run: python -m spec_to_test.evaluation --rules-only --json ../evaluation-rules.json --markdown ../evaluation-rules.md
      - name: Publish evaluation summary
        if: always()
        run: |
          for report in evaluation.md evaluation-rules.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python-version }}
          path: |
            evaluation.json
            evaluation.md
            evaluation-rules.json
            evaluation-rules.md

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit runtime and AI dependencies
        run: pip-audit -r requirements-ai.txt
      - name: Audit macOS desktop app dependencies
        run: pip-audit -r requirements-desktop.txt
      - name: Audit automation dependencies
        run: pip-audit -r requirements-automation.txt
      - name: Audit QA Agent dependencies
        run: pip-audit -r requirements-qa.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the Playwright toolchain
        working-directory: automation/runner
        run: npm audit --omit=dev --audit-level=high

  automation-e2e:
    name: Automation end-to-end (real browser)
    runs-on: ubuntu-22.04  # 24.04 AppArmor blocks the Chromium sandbox
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/runner/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-automation.txt
          cd automation/runner && npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Run real-browser tests
        # The model is scripted; the MCP server, Chromium, generator and runner are real.
        run: pytest -q -m e2e -rs
      - name: Run all tests with the automation extras installed
        run: pytest -q

  qa-agent-e2e:
    name: QA Agent (real browser, Python Playwright)
    runs-on: ubuntu-22.04  # 24.04 AppArmor blocks the Chromium sandbox
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Run QA Agent tests against the local Demo Shop
        # Fails instead of skipping if the browser could not be installed.
        run: |
          python -c "from playwright.sync_api import sync_playwright as p; b = p().start().chromium.launch(); b.close()"
          pytest -q -rs tests/test_qa_agent_e2e.py tests/test_qa_agent_ui.py tests/test_qa_auto_e2e.py tests/test_qa_auto_ui.py
