name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # AI stays off and nothing is written outside the temp folder (see tests/conftest.py).
        run: pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit runtime and AI dependencies
        run: pip-audit -r requirements-ai.txt
      - name: Audit macOS desktop app dependencies
        run: pip-audit -r requirements-desktop.txt
      - name: Audit automation dependencies
        run: pip-audit -r requirements-automation.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the Playwright toolchain
        working-directory: automation/runner
        run: npm audit --omit=dev --audit-level=high

  automation-e2e:
    name: Automation end-to-end (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/runner/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-automation.txt
          cd automation/runner && npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Run real-browser tests
        # The model is scripted; the MCP server, Chromium, generator and runner are real.
        run: pytest -q -m e2e -rs
      - name: Run all tests with the automation extras installed
        run: pytest -q
