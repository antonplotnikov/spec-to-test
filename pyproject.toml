[project]
name = "spec-to-test"
version = "1.1.0"
description = "Analyze software requirements, detect ambiguities, and generate reviewable test cases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["e2e: real browser end-to-end tests (need automation/runner, skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".spec_to_test_data", "automation/runner/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long translated strings and readable test data are allowed to exceed the line length.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spec_to_test", "conftest", "test_localization", "grill_ui", "automation_ui", "automation_fakes"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src", "app.py", "grill_ui.py", "automation_ui.py"]
